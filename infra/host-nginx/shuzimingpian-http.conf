server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yeshuangxixue.cn www.yeshuangxixue.cn 47.83.235.176;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://yeshuangxixue.cn$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name yeshuangxixue.cn www.yeshuangxixue.cn;

    ssl_certificate /etc/letsencrypt/live/yeshuangxixue.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeshuangxixue.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/shuzimingpian.access.log;
    error_log /var/log/nginx/shuzimingpian.error.log warn;

    client_max_body_size 32m;
    server_tokens off;

    location = / {
        return 302 /c/xijingkeji;
    }

    location = /card {
        return 301 /c/xijingkeji;
    }

    location = /card/ {
        return 301 /c/xijingkeji;
    }

    location = /c/docs { return 404; }
    location = /c/docs/ { return 404; }
    location = /c/openapi.json { return 404; }
    location = /docs { return 404; }
    location = /openapi.json { return 404; }

    location ^~ /c/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /c;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering on;
        client_max_body_size 32m;
    }

    location / {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

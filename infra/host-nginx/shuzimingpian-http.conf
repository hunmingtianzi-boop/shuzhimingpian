server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tuotuzju.com www.tuotuzju.com 47.83.235.176;

    access_log /var/log/nginx/shuzimingpian.access.log;
    error_log /var/log/nginx/shuzimingpian.error.log warn;

    client_max_body_size 32m;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        return 302 /c/xijingkeji;
    }

    location = /card {
        return 301 /c/xijingkeji;
    }

    location = /card/ {
        return 301 /c/xijingkeji;
    }

    # The bare-IP deployment runs the application in staging transport mode
    # so staff cookies work before DNS/TLS is available. Do not expose the
    # automatically generated API schema on this Internet-facing endpoint.
    location = /c/docs { return 404; }
    location = /c/docs/ { return 404; }
    location = /c/openapi.json { return 404; }
    location = /docs { return 404; }
    location = /openapi.json { return 404; }

    location ^~ /c/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /c;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering on;
        client_max_body_size 32m;
    }

    location / {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

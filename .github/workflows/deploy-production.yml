name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: production
      url: ${{ vars.HEALTHCHECK_URL }}

    steps:
      - name: Resolve the verified main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            deploy_sha="$(jq -r '.workflow_run.head_sha' "${GITHUB_EVENT_PATH}")"
          else
            deploy_sha="${GITHUB_SHA}"
          fi
          [[ "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]
          printf 'DEPLOY_SHA=%s\n' "${deploy_sha}" >>"${GITHUB_ENV}"

      - name: Require successful automated validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          require_workflow() {
            local workflow_file="$1"
            local workflow_label="$2"
            local validation_run run_id run_status run_conclusion attempt

            for attempt in $(seq 1 120); do
              validation_run="$(
                gh api \
                  --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
                  -f event=push \
                  -f head_sha="${DEPLOY_SHA}" \
                  -F per_page=20 \
                  --jq '
                    if (.workflow_runs | length) == 0 then
                      "missing\t\t"
                    else
                      (
                        .workflow_runs
                        | sort_by(.run_number)
                        | last
                        | [.id, .status, (.conclusion // "")]
                        | @tsv
                      )
                    end
                  '
              )"
              IFS=$'\t' read -r run_id run_status run_conclusion <<<"${validation_run}"

              if [[ "${run_status}" == "completed" &&
                    "${run_conclusion}" == "success" ]]; then
                echo "${workflow_label} run ${run_id} passed for ${DEPLOY_SHA}."
                return 0
              fi

              if [[ "${run_status}" == "completed" ]]; then
                echo "::error::${workflow_label} run ${run_id} concluded ${run_conclusion}."
                exit 1
              fi

              if [[ "${attempt}" -eq 120 ]]; then
                echo "::error::Timed out waiting for ${workflow_label} validation of ${DEPLOY_SHA}."
                exit 1
              fi

              echo "Waiting for ${workflow_label} validation of ${DEPLOY_SHA} (${run_status:-missing})."
              sleep 15
            done
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            require_workflow ci.yml CI
          fi
          require_workflow security.yml Security

      - name: Check out the exact commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a stale deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${DEPLOY_SHA}" ]]; then
            echo "::notice::Skipping ${DEPLOY_SHA}; main is now ${current_main}."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the public card for /c/
        env:
          VITE_API_BASE_URL: /c/api/v1
          VITE_PUBLIC_BASE: /c/
          VITE_ENABLE_BLANK_ENTERPRISE_TEMPLATE: "true"
        run: |
          pnpm --filter @cf/card-web exec tsc -b
          pnpm --filter @cf/card-web exec vite build --base /c/

      - name: Build the administration app for /c/admin/
        env:
          VITE_API_BASE_URL: /c/api/v1
          VITE_PUBLIC_BASE: /c/admin/
        run: |
          pnpm --filter @cf/admin-web exec tsc -b
          pnpm --filter @cf/admin-web exec vite build --base /c/admin/

      - name: Create a source-controlled release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="${RUNNER_TEMP}/release-stage"
          archive="${RUNNER_TEMP}/cf-ai-card-release-${DEPLOY_SHA}.tar.gz"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          git archive "${DEPLOY_SHA}" | tar -x -C "${stage}"
          mkdir -p \
            "${stage}/apps/card-web/dist" \
            "${stage}/apps/admin-web/dist"
          cp -a apps/card-web/dist/. "${stage}/apps/card-web/dist/"
          cp -a apps/admin-web/dist/. "${stage}/apps/admin-web/dist/"
          if find "${stage}" -type f \
            \( -name '.env' -o -name '.env.*' \) \
            ! -name '.env.example' -print -quit | grep -q .; then
            echo "::error::Release staging contains an environment file."
            exit 1
          fi
          tar -C "${stage}" -czf "${archive}" .
          archive_sha="$(sha256sum "${archive}" | awk '{print $1}')"
          printf 'RELEASE_ARCHIVE=%s\n' "${archive}" >>"${GITHUB_ENV}"
          printf 'RELEASE_ARCHIVE_SHA=%s\n' "${archive_sha}" >>"${GITHUB_ENV}"

      - name: Configure pinned production SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_SSH_PRIVATE_KEY:?production secret DEPLOY_SSH_PRIVATE_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?production secret DEPLOY_KNOWN_HOSTS is required}"
          : "${DEPLOY_HOST:?production variable DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?production variable DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?production variable DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?production variable DEPLOY_PATH is required}"
          : "${HEALTHCHECK_URL:?production variable HEALTHCHECK_URL is required}"
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${DEPLOY_PORT}" =~ ^[0-9]+$ ]]
          [[ "${DEPLOY_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]]
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" >"${HOME}/.ssh/production_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/production_deploy" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/production_deploy" >/dev/null
          ssh-keygen -F "${DEPLOY_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Upload and deploy the release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_archive="/tmp/cf-ai-card-release-${DEPLOY_SHA}-${GITHUB_RUN_ID}.tar.gz"
          remote_script="/tmp/cf-ai-card-deploy-${DEPLOY_SHA}-${GITHUB_RUN_ID}.sh"
          ssh_options=(
            -i "${HOME}/.ssh/production_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=12
          )
          scp \
            "${ssh_options[@]}" \
            -P "${DEPLOY_PORT}" \
            "${RELEASE_ARCHIVE}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          scp \
            "${ssh_options[@]}" \
            -P "${DEPLOY_PORT}" \
            infra/ops/deploy-production.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_script}"
          ssh \
            "${ssh_options[@]}" \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -Eeuo pipefail
             trap 'rm -f -- \"${remote_script}\"' EXIT
             APP_ROOT='${DEPLOY_PATH}' ENV_FILE='${DEPLOY_PATH}/.env.production' \
               bash '${remote_script}' '${DEPLOY_SHA}' '${remote_archive}' '${RELEASE_ARCHIVE_SHA}'
             test \"\$(cat '${DEPLOY_PATH}/deploy/deployed-sha')\" = '${DEPLOY_SHA}'
             current_release=\"\$(readlink -f '${DEPLOY_PATH}/current')\"
             test -n \"\${current_release}\"
             test \"\$(cat \"\${current_release}/DEPLOYED_COMMIT\")\" = '${DEPLOY_SHA}'"

      - name: Verify the public production route
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 18 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 15 \
            "${HEALTHCHECK_URL}" \
            >/dev/null
